version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^Merge pull request'
      - '^Merge branch'

brews:
  - repository:
      owner: NarayanaSabari
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Formula
    description: Per-project .env vault with comments, git audit log, worktree-aware, agent-safe, with a lazydocker-style TUI.
    homepage: https://github.com/NarayanaSabari/envkit
    license: MIT
    test: |
      system "#{bin}/envkit", "version"
